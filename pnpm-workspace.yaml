# pnpm workspace (pnpm 11+ — these settings are read from this file, not .npmrc).
# See docs/2026-08-09-expo-repo-structure-migration.md §6.1.

packages:
  - "apps/*"
  - "packages/*"

# React Native tooling (autolinking, CocoaPods, Gradle codegen) assumes a flat node_modules.
# pnpm's default `isolated` linker is a symlink farm and breaks it with opaque codegen errors.
# `hoistingLimits: workspaces` hoists only as far as each workspace package, so apps/mobile gets
# the flat tree RN needs without one giant shared pile at the root.
nodeLinker: hoisted
hoistingLimits: workspaces

# Duplicate React in a single app is a runtime error, and a `^` range in apps/* would let a future
# `pnpm update` split web and mobile apart. Pin both across the workspace, exactly.
#
# The number is React Native's to choose: react-native@0.86 (Expo SDK 57) declares
# `peerDependencies.react: "^19.2.3"` and the SDK pins 19.2.3, while Next only asks for ^19.0.0 —
# so the tighter constraint wins and one version still serves both apps. apps/*/package.json
# declare the same exact version, so the range never contradicts the override.
# Bump here and in every app together when an SDK upgrade moves it.
overrides:
  react: 19.2.3
  react-dom: 19.2.3
  # The fourth member of the LiveKit/ElevenLabs coherent set (S1/D10). `@livekit/react-native@2.9.8`
  # depends on `@livekit/components-react: ^2.9.17`, which today resolves to 2.9.24 — and that peers
  # `livekit-client: ^2.20.1`, while `@elevenlabs/client` pins livekit-client to exactly 2.16.1.
  # 2.9.19 is the newest release whose peer (`^2.16.0`) still accepts it. This is not cosmetic:
  # `@livekit/react-native`'s hooks.ts imports components-react at module scope, so it is loaded
  # the moment the ElevenLabs SDK imports the package.
  # Scoped to the one parent that pulls it in. See docs/2026-08-13-expo-s1-background-audio.md §2 D10.
  "@livekit/react-native>@livekit/components-react": 2.9.19

# pnpm 10+ blocks dependency postinstall scripts until they are named here. Both of these ran
# unblocked under pnpm 9, so approving them restores the previous behaviour rather than granting
# anything new — and both are load-bearing:
#   esbuild — the engine behind `tsx`, i.e. sync:agents, level:items, enrich:words, check:shared
#   sharp   — Next's image optimizer at build time
allowBuilds:
  esbuild: true
  sharp: true
  # unrs-resolver — the native module resolver behind eslint-config-expo's import plugin. Blocking
  # it does not warn, it FAILS: pnpm's deps-status check exits non-zero, so `pnpm typecheck` in
  # apps/mobile dies before tsc ever runs. Added while scaffolding apps/mobile (S0).
  unrs-resolver: true
  # dtrace-provider — an OPTIONAL native DTrace probe for bunyan, which eas-cli logs through.
  # Explicitly denied rather than left unanswered: an unanswered package makes `pnpm install` exit
  # non-zero, and bunyan degrades to plain logging without it. Nothing here wants DTrace probes.
  dtrace-provider: false
  # browser-tabs-lock — its postinstall is a console.log advertisement and nothing else (verified by
  # reading scripts/postinstall.js). It arrives via @auth0/auth0-spa-js, which is
  # react-native-auth0's WEB platform adapter — code an iOS-only app never executes. Denied rather
  # than left unanswered, for the same reason as dtrace-provider above.
  browser-tabs-lock: false
