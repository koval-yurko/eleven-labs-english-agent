openapi: 3.1.0
info:
  title: Live-Story Stale-Session Sweep (008-langsmith-tracing)
  version: 1.0.0
  description: >
    Scheduled finalizer that closes sessions abandoned without a clean end signal so they do
    not freeze as "active" and so a finalized trace is produced (FR-003, SC-002, R5).

paths:
  /api/live-story/sweep:
    post:
      summary: Finalize live-story sessions idle longer than the abandonment threshold.
      description: >
        Intended to be invoked on a schedule (cron). Finds active sessions whose
        last_activity_at is older than 10 minutes (bounded batch), marks each ended with
        termination_reason "abandoned", and records a finalized self-reported trace per
        session. Idempotent: a session already ended (e.g. a late webhook landed first)
        is skipped, so it reconciles to a single finalized trace (FR-009). Best-effort.
      security:
        - sweepSecret: []
      responses:
        '200':
          description: Sweep ran.
          content:
            application/json:
              schema:
                type: object
                properties:
                  finalized: { type: integer, description: number of sessions closed this run }
                  scanned: { type: integer }
        '401':
          description: Missing or invalid sweep secret.

components:
  securitySchemes:
    sweepSecret:
      type: apiKey
      in: header
      name: Authorization
      description: >
        Bearer CRON_SECRET (or platform cron auth). Not Auth0 — there is no learner session;
        the route operates across owners with the service-role client.

  # Parameters (from config, not request body):
  #   idleThresholdMinutes = 10   (spec clarification Q1 / FR-003)
  #   batchLimit                  (bound work per run; remaining sessions caught next tick)
