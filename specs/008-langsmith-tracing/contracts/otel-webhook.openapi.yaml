openapi: 3.1.0
info:
  title: Live-Story Telemetry Webhook (008-langsmith-tracing)
  version: 1.0.0
  description: >
    Inbound ElevenLabs post-call webhook that delivers per-session telemetry, and the
    outbound LangSmith OTLP forward the route performs. Best-effort and HMAC-verified.

paths:
  /api/live-story/elevenlabs/otel-webhook:
    post:
      summary: Receive an ElevenLabs post-call telemetry delivery and relay it to LangSmith.
      description: >
        Called by ElevenLabs when a story call ends. The route (1) HMAC-verifies the raw
        body against ELEVENLABS_CONVAI_WEBHOOK_SECRET, (2) parses the envelope, (3) correlates
        conversation_id -> {lessonId, ownerId} via the service-role repository, (4) enriches
        the OTLP resourceSpans with lesson/owner/thread attributes (or hand-builds a trace on
        the JSON-fallback branch), and (5) forwards to LangSmith OTLP ingest. Never touches the
        learner's live session; never throws into persistence.
      security:
        - elevenLabsHmac: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TelemetryDelivery'
      responses:
        '200':
          description: >
            Delivery accepted (verified + well-formed). Returned even when the downstream
            LangSmith forward fails — a redelivery would not fix a LangSmith outage, and a
            5xx would trigger unhelpful ElevenLabs retries (FR-008). Correlation miss is also
            a 200 (trace still forwarded, tagged "unmatched", FR-005).
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, enum: [forwarded, unmatched, no_sink] }
        '401':
          description: HMAC signature missing or invalid — rejected, no trace produced (FR-007).
        '400':
          description: Body present but not a recognized telemetry envelope.

components:
  securitySchemes:
    elevenLabsHmac:
      type: apiKey
      in: header
      name: ElevenLabs-Signature
      description: >
        HMAC-SHA256 over "{timestamp}.{rawBody}" using ELEVENLABS_CONVAI_WEBHOOK_SECRET,
        format "t=<unix>,v0=<hex>". Verified against the RAW request body before parsing.

  schemas:
    TelemetryDelivery:
      type: object
      required: [type, data]
      properties:
        type:
          type: string
          enum: [post_call_transcription_otel, post_call_transcription]
          description: OTel variant (primary, R1) or JSON variant (B1 fallback, R2).
        event_timestamp:
          type: integer
        data:
          type: object
          required: [conversation_id, agent_id]
          properties:
            conversation_id:
              type: string
              description: Correlation key -> findSessionByConversationId.
            agent_id:
              type: string
              description: Sanity-checked against ELEVENLABS_STORY_AGENT_ID.
            otlp_traces:
              type: object
              description: Present on the OTel variant; { resourceSpans: [...] } forwarded to LangSmith.
              properties:
                resourceSpans:
                  type: array
                  items: { type: object }
            metadata:
              type: object
              description: Present on the JSON variant; cost, termination_reason, call_duration_secs.
            conversation_turn_metrics:
              type: object
              description: JSON-variant per-turn latency/TTFB used to hand-build the trace tree.

  # ---- Outbound (documented for reference; performed by the route, not exposed) ----
  # POST {LANGSMITH_ENDPOINT}/otel/v1/traces
  #   headers: x-api-key: $LANGSMITH_API_KEY, Langsmith-Project: $LANGSMITH_PROJECT
  #   body:    { resourceSpans: [ ...enriched with lessonId/ownerId/thread_id... ] }
  #   soft dependency: skipped (status:no_sink) when LANGSMITH_API_KEY is unset.
